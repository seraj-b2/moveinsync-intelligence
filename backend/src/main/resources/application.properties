spring.application.name=moveinsync-intelligence

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/moveinsync?options=-c%20TimeZone=UTC
spring.datasource.username=moveinsync
spring.datasource.password=moveinsync_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080